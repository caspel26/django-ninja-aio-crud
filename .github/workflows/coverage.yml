name: Coverage

on:
  push:
    branches: [ main, feat/v3-api-redesign ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test_coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            django: 'Django>=5.2,<5.3'
            ninja: 'django-ninja>=1.7,<1.8'
            lock: django52
          - python: '3.11'
            django: 'Django>=5.2,<5.3'
            ninja: 'django-ninja>=1.7,<1.8'
            lock: django52
          - python: '3.12'
            django: 'Django>=5.2,<5.3'
            ninja: 'django-ninja>=1.7,<1.8'
            lock: django52
          - python: '3.13'
            django: 'Django>=5.2,<5.3'
            ninja: 'django-ninja>=1.7,<1.8'
            lock: django52
          - python: '3.14'
            django: 'Django>=6.0,<6.1'
            ninja: 'django-ninja>=1.7,<1.8'
            lock: django60
          - python: '3.10'
            django: 'Django==5.2'
            ninja: 'django-ninja==1.7.0'
            lock: minimum

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Dependencies
        run: |
          pip install --only-binary :all: --require-hashes -r '.github/requirements/${{ matrix.lock }}.txt'
          python -m flit install --symlink --deps none
      - name: Test
        run: |
          coverage run -m django test --settings=tests.test_settings --exclude-tag=performance --exclude-tag=scalability --exclude-tag=comparison
          ruff check .

      - name: Library sync/async parity
        working-directory: examples/library
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
          PYTHONWARNINGS: error::DeprecationWarning,error::RuntimeWarning,error::UserWarning
        run: coverage run --append -m django test library --settings=library_project.settings

      - name: Public facade types
        if: matrix.python == '3.14'
        run: |
          pyright --pythonpath "$(command -v python)" tests/typing/facade_contract.py

      - name: Report coverage
        run: |
          coverage report
          coverage xml

      - name: Coverage
        if: matrix.python == '3.14'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
