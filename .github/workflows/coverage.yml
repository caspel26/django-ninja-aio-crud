name: Coverage

on:
  push:
    branches: [ main, feat/v3-api-redesign ]
  pull_request:
    branches: [ main ]

jobs:
  test_coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            django: 'Django>=5.2,<5.3'
            ninja: 'django-ninja>=1.7,<1.8'
          - python: '3.11'
            django: 'Django>=5.2,<5.3'
            ninja: 'django-ninja>=1.7,<1.8'
          - python: '3.12'
            django: 'Django>=5.2,<5.3'
            ninja: 'django-ninja>=1.7,<1.8'
          - python: '3.13'
            django: 'Django>=5.2,<5.3'
            ninja: 'django-ninja>=1.7,<1.8'
          - python: '3.14'
            django: 'Django>=6.0,<6.1'
            ninja: 'django-ninja>=1.7,<1.8'
          - python: '3.10'
            django: 'Django==5.2'
            ninja: 'django-ninja==1.7.0'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Dependencies
        run: pip install -e '.[dev,mcp,comparison]' '${{ matrix.django }}' '${{ matrix.ninja }}'
      - name: Test
        run: |
          coverage run -m django test --settings=tests.test_settings --exclude-tag=performance --exclude-tag=scalability --exclude-tag=comparison
          ruff check .
          coverage report
          coverage xml

      - name: Library sync/async parity
        working-directory: examples/library
        run: python -W error::DeprecationWarning -W error::RuntimeWarning -W error::UserWarning manage.py test library

      - name: Public facade types
        if: matrix.python == '3.14'
        run: |
          pip install pyright
          pyright --pythonpath "$(command -v python)" tests/typing/facade_contract.py

      - name: Coverage
        if: matrix.python == '3.14'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
