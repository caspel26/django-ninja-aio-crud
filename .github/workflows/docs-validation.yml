name: Validate Docs

on:
  push:
    branches: [main, feat/v3-api-redesign]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-tests/package-lock.json
      - name: Install build dependencies
        run: pip install -r docs-tests/requirements.txt
      - name: Build documentation
        run: zensical build --strict
      - name: Install browser tests
        working-directory: docs-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate visuals, accessibility, and performance budgets
        working-directory: docs-tests
        run: npm test
      - name: Save browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-validation
          path: |
            docs-tests/playwright-report/
            docs-tests/test-results/
          retention-days: 7
