name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
      - name: Install Flit
        # Flit 3.12 passes gen_setup_py to SdistBuilder.build; flit_core 4
        # removed that argument. Keep the CLI and backend on a verified pair.
        run: |
          pip install --only-binary :all: --require-hashes -r .github/requirements/publish.txt
      - name: Install Dependencies
        run: flit install --symlink
      - name: Publish
        env:
          FLIT_USERNAME: __token__
          FLIT_PASSWORD: ${{ secrets.FLIT_PASSWORD }}
        run: flit publish
