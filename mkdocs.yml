theme:
  custom_dir: overrides
  font: false
  name: material
  variant: classic
  language: en
  logo: images/brand/mark-light-256.png
  favicon: images/favicon.ico
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
      primary: custom
      accent: custom
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
      primary: custom
      accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.path
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    - search.suggest
    - search.highlight
    - search.share

extra:
  nac_version: "3.0"
  project:
    name: django-ninja-aio-crud
    pypi: django-ninja-aio-crud
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/caspel26/django-ninja-aio-crud
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/django-ninja-aio-crud/
      name: PyPI
  version:
    provider: mike
    alias: true
    repo: caspel26/django-ninja-aio-crud
    default: latest

plugins:
  - macros:
      include_dir: docs
  - search:
      separator: '[\\s\\-]+'
  - autorefs
  - section-index
  - redirects:
      redirect_maps:
        getting_started/quick_start_serializer.md: getting_started/choosing-a-serializer.md
        tutorial/serializer.md: tutorial/model.md
        tutorial/soft_delete.md: guides/soft-delete.md
        api/type_hints.md: guides/type-hints.md
        api/models/model_util.md: migration/deprecations.md#modelutil
        api/models/validators.md: guides/validation.md
        api/admin.md: guides/admin.md
        api/branding.md: guides/swagger-ui.md
        auth.md: guides/authentication.md
        auth_cookie.md: guides/cookie-authentication.md
        mcp.md: guides/mcp.md
        logging.md: guides/logging.md
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            show_source: false
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            show_if_no_docstring: false
            show_root_heading: false
            show_root_toc_entry: false
            heading_level: 3
            merge_init_into_class: true
            members_order: source
            filters:
              - "!^_"
            inherited_members: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.highlight:
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: caspel26
      repo: django-ninja-aio-crud
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html

extra_css:
  - stylesheets/tokens.css
  - stylesheets/shell.css
  - stylesheets/components.css
  - stylesheets/pages.css

extra_javascript:
  - javascripts/theme.js
  - javascripts/a11y.js
  - javascripts/home.js
