site_name: django-ninja-aio-crud
site_description: Async CRUD utilities for Django Ninja with auth, filtering, pagination.
site_url: https://django-ninja-aio.com/
repo_name: caspel26/django-ninja-aio-crud
repo_url: https://github.com/caspel26/django-ninja-aio-crud
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024 – 2026 caspel26
use_directory_urls: true

nav:
  - Home: index.md
  - Get started:
    - Installation: getting_started/installation.md
    - Quick start: getting_started/quick_start.md
    - Choosing a serializer: getting_started/choosing-a-serializer.md
  - Tutorial:
    - tutorial/index.md
    - 1. Define the model: tutorial/model.md
    - 2. Create the CRUD API: tutorial/crud.md
    - 3. Add relations: tutorial/relations.md
    - 4. Add authentication: tutorial/authentication.md
    - 5. Add permissions: tutorial/permissions.md
    - 6. Filter, search and sort: tutorial/filtering.md
    - 7. Go to production: tutorial/production.md
    - Soft Delete: tutorial/soft_delete.md
  - API Reference:
    - Type Hints & Type Safety: api/type_hints.md
    - Views:
      - APIView: api/views/api_view.md
      - APIViewSet: api/views/api_view_set.md
      - NinjaAIORouter: api/views/router.md
      - Decorators: api/views/decorators.md
      - Mixins: api/views/mixins.md
    - Models:
      - ModelSerializer: api/models/model_serializer.md
      - ModelUtil: api/models/model_util.md
      - Serializer (Meta-driven): api/models/serializers.md
      - Validators: api/models/validators.md
    - Auto Admin: api/admin.md
    - Swagger UI: api/branding.md
    - Authentication: api/authentication.md
    - Exceptions: api/exceptions.md
    - Pagination: api/pagination.md
    - Renderers: api/renderers/orjson_renderer.md
  - Authentication:
      - JWT & AsyncJwtBearer: auth.md
      - Cookie Auth (BFF): auth_cookie.md
  - AI Agent Integration (MCP): mcp.md
  - Benchmarks:
      - Framework Comparison: comparison.md
      - Performance: performance.md
  - Resources:
      - Logging: logging.md
      - Deployment: deployment.md
      - Troubleshooting: troubleshooting.md
      - Contributing: contributing.md
      - Release Notes: release_notes.md

theme:
  custom_dir: overrides
  font: false
  name: material
  variant: classic
  language: en
  logo: images/brand/mark-light-256.png
  favicon: images/favicon.ico
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
      primary: custom
      accent: custom
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
      primary: custom
      accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.path
    - toc.follow
    - toc.integrate
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    - search.suggest
    - search.highlight
    - search.share

extra:
  project:
    name: django-ninja-aio-crud
    pypi: django-ninja-aio-crud
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/caspel26/django-ninja-aio-crud
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/django-ninja-aio-crud/
      name: PyPI
  analytics:
    provider: google
  version:
    provider: mike
    alias: true
    repo: caspel26/django-ninja-aio-crud
    default: latest

plugins:
  - macros:
      include_dir: docs
  - search:
      separator: '[\\s\\-]+'
  - autorefs
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ./ninja_aio
          options:
            show_source: true
            docstring_style: google
            separate_signature: true
            show_if_no_docstring: true
            merge_init_into_class: true
            members_order: source
            filters:
              - "!^__"
            inherited_members: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.highlight:
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: caspel26
      repo: django-ninja-aio-crud
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html

extra_css:
  - stylesheets/tokens.css
  - stylesheets/shell.css
  - stylesheets/components.css
  - stylesheets/pages.css

extra_javascript:
  - javascripts/a11y.js
  - javascripts/home.js
